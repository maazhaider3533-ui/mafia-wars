<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mafia Wars — Home</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-home">

  <nav class="navbar">
    <div class="brand">🎭 Mafia Wars</div>
    <ul class="nav-links">
      <li><a class="nav-link" href="index.html">Home</a></li>
      <li><a class="nav-link" href="mafia.html">Mafia Wins</a></li>
      <li><a class="nav-link" href="jester.html">Jester Wins</a></li>
      <li><a class="nav-link" href="ace.html">Ace Wins</a></li>
    </ul>
  </nav>

  <main>
    <h1 class="page-title">Leaderboard Overview</h1>
    <p class="page-subtitle">Top player in each win category</p>

    <div class="summary-grid">
      <div class="summary-card mafia-card">
        <div class="icon">🕶️</div>
        <div class="label">Most Mafia Wins</div>
        <div class="leader-name" id="mafia-leader">—</div>
        <div class="leader-score" id="mafia-leader-score"></div>
      </div>

      <div class="summary-card jester-card">
        <div class="icon">🃏</div>
        <div class="label">Most Jester Wins</div>
        <div class="leader-name" id="jester-leader">—</div>
        <div class="leader-score" id="jester-leader-score"></div>
      </div>

      <div class="summary-card ace-card">
        <div class="icon">♠️</div>
        <div class="label">Most Ace Wins</div>
        <div class="leader-name" id="ace-leader">—</div>
        <div class="leader-score" id="ace-leader-score"></div>
      </div>
    </div>
  </main>

  <footer>Mafia Wars Scoreboard</footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>renderHomeSummary();</script>
</body>
</html>
